<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | UniConnect</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>


<body class="register-page">

    <main class="register-layout">

        <header class="register-header">

            <a
                href="{{ url_for('home') }}"
                class="register-brand"
            >
                <span class="brand-dark">Uni</span><span class="brand-green">Connect</span>
            </a>

            <h1>
                Connect. Collaborate. Belong.
            </h1>

            <p>
                Join your university community today.
            </p>

        </header>


        <section class="register-card">

            <h2>
                Create your account
            </h2>


            {% if error %}

                <p class="auth-error">
                    {{ error }}
                </p>

            {% endif %}


            <form
                action="{{ url_for('register') }}"
                method="post"
                class="register-form"
            >

                <div class="register-field">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        value="{{ name }}"
                    >

                </div>


                <div class="register-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        value="{{ email }}"
                    >

                </div>


                <div class="register-field">

                    <label for="university-search">
                        University
                    </label>

                    <div class="university-dropdown">

                        <input
                            type="text"
                            id="university-search"
                            placeholder="Search for your university"
                            autocomplete="off"
                            value="{{ university }}"
                        >

                        <input
                            type="hidden"
                            id="university"
                            name="university"
                            value="{{ university }}"
                        >

                        <div
                            id="university-options"
                            class="university-options"
                        >

                            {% for university in universities %}

                                <button
                                    type="button"
                                    class="university-option"
                                    data-value="{{ university }}"
                                >
                                    {{ university }}
                                </button>

                            {% endfor %}

                        </div>

                    </div>

                </div>


                <div class="register-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                    >

                </div>


                <div class="register-field">

                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                    >

                </div>


                <button
                    type="submit"
                    class="register-submit"
                >
                    Create account
                </button>

            </form>


            <p class="register-login">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Log in
                </a>

            </p>

        </section>


        <div class="register-trust">

            <span>✓ Secure</span>

            <span>✓ Private</span>

            <span>✓ For students</span>

        </div>

    </main>



    <script>

        const searchInput =
            document.getElementById("university-search");

        const hiddenInput =
            document.getElementById("university");

        const optionsContainer =
            document.getElementById("university-options");

        const options =
            document.querySelectorAll(".university-option");



        searchInput.addEventListener(
            "focus",
            function () {

                optionsContainer.classList.add("show");

            }
        );



        searchInput.addEventListener(
            "input",
            function () {

                const searchValue =
                    searchInput.value.toLowerCase();


                hiddenInput.value = "";


                options.forEach(
                    function (option) {

                        const universityName =
                            option.dataset.value.toLowerCase();


                        if (
                            universityName.includes(searchValue)
                        ) {

                            option.style.display = "block";

                        } else {

                            option.style.display = "none";

                        }

                    }
                );


                optionsContainer.classList.add("show");

            }
        );



        options.forEach(
            function (option) {

                option.addEventListener(
                    "click",
                    function () {

                        const university =
                            option.dataset.value;


                        searchInput.value =
                            university;

                        hiddenInput.value =
                            university;


                        optionsContainer.classList.remove(
                            "show"
                        );

                    }
                );

            }
        );



        document.addEventListener(
            "click",
            function (event) {

                if (
                    !event.target.closest(
                        ".university-dropdown"
                    )
                ) {

                    optionsContainer.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>

</html>
