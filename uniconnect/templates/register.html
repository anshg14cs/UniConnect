<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | UniConnect</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
</head>

<body>

    <h1>Create your UniConnect account</h1>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form
        action="{{ url_for('register') }}"
        method="post"
    >

        <div>
            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value = "{{name}}"
            >
        </div>


        <div>
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value = "{{email}}"
            >
        </div>

<div class="university-field">
    <label for="university-search">University:</label>

    <div class="university-dropdown">
        <input
            type="text"
            id="university-search"
            placeholder="Search for your university"
            autocomplete="off"
            value="{{ university }}"
        >

        <input
            type="hidden"
            id="university"
            name="university"
            value="{{ university }}"
        >

        <div
            id="university-options"
            class="university-options"
        >
            {% for university in universities %}
                <button
                    type="button"
                    class="university-option"
                    data-value="{{ university }}"
                >
                    {{ university }}
                </button>
            {% endfor %}
        </div>
    </div>
</div>
      


        <div>
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
            >
        </div>


        <div>
            <label for="confirm-password">
                Confirm password
            </label>

            <input
                type="password"
                id="confirm-password"
                name="confirm_password"
            >
        </div>


        <button type="submit">
            Create account
        </button>

    </form>

<script>
    const searchInput = document.getElementById("university-search");
    const hiddenInput = document.getElementById("university");
    const optionsContainer = document.getElementById("university-options");
    const options = document.querySelectorAll(".university-option");

    searchInput.addEventListener("focus", function () {
        optionsContainer.classList.add("show");
    });

    searchInput.addEventListener("input", function () {
        const searchValue = searchInput.value.toLowerCase();

        hiddenInput.value = "";

        options.forEach(function (option) {
            const universityName = option.dataset.value.toLowerCase();

            if (universityName.includes(searchValue)) {
                option.style.display = "block";
            } else {
                option.style.display = "none";
            }
        });

        optionsContainer.classList.add("show");
    });

    options.forEach(function (option) {
        option.addEventListener("click", function () {
            const university = option.dataset.value;

            searchInput.value = university;
            hiddenInput.value = university;

            optionsContainer.classList.remove("show");
        });
    });

    document.addEventListener("click", function (event) {
        if (!event.target.closest(".university-dropdown")) {
            optionsContainer.classList.remove("show");
        }
    });
</script>

</body>
</html>
